<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="{{url_for('static',filename='app_login.css')}}">
     <!-- <link rel = "stylesheet" href="app_login.css"> -->
</head>
<body>
    <div>
        {% if error %}
            <p>{{error}}</p>
        {% endif %}
    </div>
    <div class="login-container">
        <div class="logo">
            <img src="{{ url_for('static', filename='travail.png') }}">
        </div>
        <div class="head">
            <h1>Vishu</h1>
            
        </div>
        {% if message %}
            <h3>{{message}}</h3>
        {% endif %}
        <div class="form">
            <form class="login-form" action="/login" method="post">
                <input type="text" name="username" placeholder="Username" required>
                <input type="password" name="password" placeholder="Password" required minlength="1">
                <button type="submit">Login</button>
                <h4>
                <a href="{{ url_for('student.register') }}">Register as Student</a><br>
                <a href="{{ url_for('company.register') }}">Register as Company</a>
                </h4>
                <h4>Current Login @ {{time}}</h4>

            </form>
        </div>
    </div>
</body>
</html>

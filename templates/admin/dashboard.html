<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='admin_dashboard.css') }}">
</head>
<body>

    <nav class="top-nav">
        <div class="logo">
            <img src="{{ url_for('static', filename='travail.png') }}">
        </div>
        <div>Welcome, {{ current_user.username }}</div>
    </nav>

    <div class="main-wrapper">

        <!-- Sidebar -->
        <aside class="side-nav">
            <ul>
                <li><a href="{{ url_for('admin.dashboard') }}">🏠 Dashboard</a></li>
                <li><a href="{{ url_for('admin.viewCompany') }}">🏢 Companies</a></li>
                <li><a href="{{ url_for('admin.viewStudent') }}">👥 Students</a></li>
                <li><a href="{{ url_for('admin.viewDrive') }}">📋 Drives</a></li>
                <li><a href="{{ url_for('admin.viewApplication') }}">📝 Applications</a></li>
            </ul>
            <div class="logout">
                <ul>
                    <li><a href="{{ url_for('auth.logout') }}">🚪 Logout</a></li>
                </ul>
            </div>
        </aside>

        <!-- Main content -->
        <main class="content">
            <h2> {{ message }} </h2>
            {% block content %} {% endblock %}
        </main>
    </div>
</body>
</html>
